<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ֆուտբոլի վիկտորինա</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#063b2c,#16834f);font-family:Arial,sans-serif;color:#183328}.card{width:min(700px,100%);background:white;border-radius:22px;padding:24px;box-shadow:0 15px 45px #001b1280}h1{text-align:center;color:#087443}.muted{text-align:center;color:#63776b}.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold}.track{height:9px;background:#e4eee8;border-radius:20px;margin:16px 0}.fill{height:100%;background:#16a765;width:0;border-radius:20px}.q{font-size:21px;font-weight:bold;line-height:1.4;margin:20px 0}.answers{display:grid;gap:10px}.answer{padding:14px;border:2px solid #dce9e1;border-radius:12px;background:#f8fcf9;text-align:left;font-size:16px;cursor:pointer}.answer:disabled{cursor:default}.correct{background:#e2f8eb;border-color:#159b5b}.wrong{background:#fff0ed;border-color:#dc6558}.feedback{min-height:28px;margin:14px 0;font-weight:bold}button.main{border:0;border-radius:12px;padding:12px 20px;background:#087443;color:white;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.45}input{width:100%;padding:13px;border:2px solid #dce9e1;border-radius:12px;font-size:16px;margin:10px 0 16px}.hidden{display:none}.score{font-size:42px;color:#15945a;font-weight:bold;text-align:center}.center{text-align:center}
</style></head><body><main class="card"><h1>⚽ Ֆուտբոլի վիկտորինա</h1><p class="muted">20 հարց ֆուտբոլի մասին․ ստուգիր գիտելիքներդ։</p>
<section id="start"><b>Գրի՛ր քո անունը</b><input id="name" placeholder="Օրինակ՝ Լյով" maxlength="24"><button class="main" onclick="begin()">Սկսել խաղը</button></section>
<section id="quiz" class="hidden"><div class="row"><span id="player"></span><span id="counter"></span><span id="points">Միավոր՝ 0</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="center"><button class="main" id="next" onclick="advance()" disabled>Հաջորդ հարցը</button></div></section>
<section id="result" class="hidden"><h2 class="center" id="headline"></h2><div class="score" id="final"></div><p class="center" id="summary"></p><p id="mistakes"></p><div class="center"><button class="main" onclick="again()">Կրկին խաղալ</button></div></section></main>
<script>
const qs=[["Քանի՞ խաղացող ունի մեկ թիմը խաղադաշտում՝ դարպասապահի հետ միասին։", ["9", "10", "11"], 2], ["Որքա՞ն է ֆուտբոլային խաղի հիմնական տևողությունը։", ["2 խաղակես՝ 45 րոպե", "3 խաղակես՝ 30 րոպե", "1 խաղակես՝ 60 րոպե"], 0], ["Ո՞ր խաղացողը կարող է ձեռքերով խաղալ իր տուգանային հրապարակում։", ["Հարձակվողը", "Դարպասապահը", "Կիսապաշտպանը"], 1], ["Ի՞նչ է նշանակում հեթ-տրիկ։", ["Երեք գոլ մեկ խաղում", "Երեք դեղին քարտ", "Երեք անկյունային"], 0], ["Ո՞ր քարտն է նշանակում հեռացում խաղից։", ["Դեղին", "Կարմիր", "Կապույտ"], 1], ["Քանի՞ միավոր է տրվում հաղթանակի համար առաջնության սովորական համակարգում։", ["1", "2", "3"], 2], ["Ինչպե՞ս է կոչվում խաղի մեկնարկին գնդակը կենտրոնից խաղի մեջ մտցնելը։", ["Անկյունային", "Մեկնարկային հարված", "Տուգանային"], 1], ["Ո՞րն է ազգային հավաքականների գլխավոր միջազգային ֆուտբոլային մրցաշարը։", ["Աշխարհի առաջնություն", "Չեմպիոնների լիգա", "Եվրոպա լիգա"], 0], ["Ի՞նչ է նշանակում «օֆսայդ»։", ["Խաղից դուրս դիրք", "Գնդակը դարպասից դուրս է", "Խաղի ավարտ"], 0], ["Քանի՞ դարպաս կա սովորական ֆուտբոլային խաղադաշտում։", ["1", "2", "4"], 1], ["Ի՞նչ մասով չի կարելի դաշտային խաղացողին դիտավորյալ խաղալ գնդակով։", ["Գլխով", "Ոտքով", "Ձեռքով կամ թևով"], 2], ["Ի՞նչ է անկյունային հարվածը։", ["Հարված անկյունային աղեղից", "Հարված կենտրոնից", "Դարպասապահի հարված"], 0], ["Ո՞րն է ֆուտբոլի միջազգային կառավարման մարմնի կարճ անվանումը։", ["FIFA", "NBA", "FIBA"], 0], ["Ի՞նչ է նշանակում «դուբլ» ֆուտբոլում։", ["Երկու գոլ մեկ խաղում", "Երկու կարմիր քարտ", "Երկու խաղակես"], 0], ["Ո՞ր մրցաշարում են խաղում եվրոպական ակումբները։", ["Չեմպիոնների լիգա", "Աշխարհի առաջնություն՝ հավաքականների", "Օլիմպիական 100 մետր"], 0], ["Ի՞նչ է անում մրցավարը խաղի ընթացքում։", ["Հետևում է կանոնների պահպանմանը", "Միայն հաշվում է գոլերը", "Ընտրում է մարզաշապիկները"], 0], ["Ի՞նչ է նշանակում ոչ-ոքի։", ["Թիմերից մեկը հաղթել է", "Խաղն ավարտվել է հավասար հաշվով", "Խաղը չի սկսվել"], 1], ["Ո՞ր դիրքի խաղացողներն են հիմնականում փորձում գոլ խփել։", ["Հարձակվողները", "Պաշտպանները", "Դարպասապահները"], 0], ["Ի՞նչ է տուգանային հարվածը։", ["Կանոնների խախտումից հետո նշանակվող հարված", "Խաղի ընդմիջումը", "Գնդակը ձեռքով նետելը"], 0], ["Ի՞նչ պետք է անել մրցավարի ավարտի սուլոցից հետո։", ["Շարունակել խաղալ", "Դադարեցնել խաղը", "Փոխել գնդակը"], 1]];let i=0,score=0,wrong=[];
function begin(){document.getElementById('player').textContent='Խաղացող՝ '+(document.getElementById('name').value.trim()||'Ֆուտբոլասեր');document.getElementById('start').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');i=0;score=0;wrong=[];show()}
function show(){let q=qs[i];document.getElementById('counter').textContent=(i+1)+' / 20';document.getElementById('points').textContent='Միավոր՝ '+score;document.getElementById('fill').style.width=(i/20*100)+'%';document.getElementById('question').textContent=(i+1)+'. '+q[0];document.getElementById('feedback').textContent='';let n=document.getElementById('next');n.disabled=true;n.textContent=i===19?'Տեսնել արդյունքը':'Հաջորդ հարցը';let box=document.getElementById('answers');box.innerHTML='';q[1].forEach((a,j)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+j)+'. '+a;b.onclick=()=>choose(j);box.appendChild(b)})}
function choose(v){let q=qs[i];document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===v&&v!==q[2])b.classList.add('wrong')});if(v===q[2]){score++;document.getElementById('feedback').textContent='Ճիշտ պատասխան է։';document.getElementById('feedback').style.color='#12834c'}else{wrong.push('Հարց '+(i+1)+': ճիշտ պատասխան՝ '+q[1][q[2]]);document.getElementById('feedback').textContent='Սխալ պատասխան։';document.getElementById('feedback').style.color='#c0443c'}document.getElementById('points').textContent='Միավոր՝ '+score;document.getElementById('next').disabled=false}
function advance(){if(++i<20)show();else finish()}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('headline').textContent=score>=16?'🏆 Հիանալի արդյունք։':'⚽ Լավ փորձ էր։';document.getElementById('final').textContent=score+' / 20';document.getElementById('summary').textContent='Ճիշտ պատասխաններ՝ '+Math.round(score/20*100)+'%։';document.getElementById('mistakes').textContent=wrong.length?wrong.join(' • '):'Բոլոր պատասխանները ճիշտ են։'}
function again(){document.getElementById('result').classList.add('hidden');document.getElementById('start').classList.remove('hidden');document.getElementById('name').value=''}
</script></body></html>
