<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ավտոկայանատեղի — Parking Challenge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
.wrap{width:min(100%,560px);padding:13px;display:flex;flex-direction:column;gap:10px}
h1{margin:4px 0;text-align:center;color:#ffd166;font-size:27px}
.stats{display:flex;justify-content:space-between;gap:8px;background:#202d40;padding:11px;border-radius:12px;font-weight:bold}
.game{position:relative;height:min(62vh,570px);min-height:390px;overflow:hidden;border:3px solid #64748b;border-radius:15px;background:#424b55}
.asphalt{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#424b55 0 75px,#48525d 75px 150px)}
.lane{position:absolute;top:0;bottom:0;left:8%;width:3px;background:repeating-linear-gradient(0deg,#e5e7eb 0 30px,transparent 30px 58px)}
.parking{position:absolute;right:8%;top:10%;width:37%;height:34%;border:4px solid #f8fafc;border-left:0;border-bottom:0}
.slot{position:absolute;right:8%;top:10%;width:37%;height:34%;border:4px dashed #facc15;background:#facc1520}
.slot span{position:absolute;inset:0;display:grid;place-items:center;color:#fde68a;font-weight:bold;font-size:18px;letter-spacing:2px}
.car{position:absolute;width:58px;height:104px;border-radius:17px;background:linear-gradient(90deg,#b91c1c,#ef4444 25%,#dc2626 75%,#991b1b);border:3px solid #fecaca;box-shadow:0 5px 10px #0008;z-index:3;left:calc(50% - 29px);top:60%;transform:rotate(0deg);transition:background .1s}
.car:before{content:"";position:absolute;left:8px;right:8px;top:17px;height:27px;border-radius:7px;background:linear-gradient(#bfdbfe,#60a5fa);border:2px solid #1e3a8a}
.car:after{content:"";position:absolute;left:8px;right:8px;bottom:12px;height:22px;border-radius:5px;background:#7dd3fc;border:2px solid #1e3a8a}
.wheel{position:absolute;width:7px;height:23px;background:#111827;border-radius:3px;top:17px}
.w1{left:-5px}.w2{right:-5px}.w3{left:-5px;top:65px}.w4{right:-5px;top:65px}
.obstacle{position:absolute;width:58px;height:100px;border-radius:14px;background:linear-gradient(90deg,#075985,#0ea5e9,#075985);border:3px solid #bae6fd;right:14%;top:53%;z-index:2}
.obstacle:before{content:"";position:absolute;left:8px;right:8px;top:15px;height:28px;background:#bfdbfe;border-radius:6px}
.obstacle:after{content:"";position:absolute;left:8px;right:8px;bottom:12px;height:20px;background:#7dd3fc;border-radius:5px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{border:0;border-radius:12px;padding:14px 8px;background:#334155;color:#fff;font-weight:bold;font-size:17px;touch-action:none}
button:active{background:#64748b;transform:scale(.98)}
.controls .up{background:#e9a23b;color:#241707}.controls .brake{background:#b91c1c}
.overlay{position:absolute;inset:0;background:#101827e8;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.overlay h2{font-size:28px;color:#ffd166;margin:0 0 8px}
.overlay button{background:#ffd166;color:#241707;padding:14px 28px}
.note{text-align:center;color:#cbd5e1;font-size:13px;line-height:1.4}
</style>
</head>
<body><main class="wrap">
<h1>🅿️ ԱՎՏՈԿԱՅԱՆԱՏԵՂԻ</h1>
<div class="stats"><span>Մակարդակ՝ <b id="level">1</b>/3</span><span>Ժամանակ՝ <b id="time">0</b> վրկ.</span><span id="status">Կայանիր մեքենան</span></div>
<div class="game" id="game">
<div class="asphalt"></div><div class="lane"></div><div class="slot"><span>ԿԱՅԱՆԵԼ</span></div><div class="parking"></div>
<div class="obstacle" id="obstacle"></div>
<div class="car" id="car"><i class="wheel w1"></i><i class="wheel w2"></i><i class="wheel w3"></i><i class="wheel w4"></i></div>
<div class="overlay" id="overlay"><h2>🅿️ Parking Challenge</h2><p>Մեքենան հասցրու դեղին կայանատեղի՝ առանց խոչընդոտին դիպչելու։ Օգտագործիր սլաքները։</p><button id="start">ՍԿՍԵԼ ԽԱՂԸ</button></div>
</div>
<div class="controls">
<button id="left">⬅ ՁԱԽ</button><button class="up" id="forward">⬆ ԱՌԱՋ</button><button id="right">ԱՋ ➡</button>
<button id="reverse">⬇ ՀԵՏ</button><button class="brake" id="brake">🛑 ԱՐԳԵԼԱԿ</button><button id="reset">↻ ՍԿՍԵԼ ՆՈՐԻՑ</button>
</div>
<div class="note">Հեռախոսով սեղմած պահիր կոճակները։ Համակարգչով կարող ես օգտագործել սլաքների կոճակները։</div>
</main>
<script>
const car=document.getElementById('car'),game=document.getElementById('game'),overlay=document.getElementById('overlay'),timeEl=document.getElementById('time'),statusEl=document.getElementById('status'),obstacle=document.getElementById('obstacle');
let x=50,y=60,angle=0,level=1,seconds=0,running=false,won=false,timer=null,keys={};
function draw(){car.style.left=`calc(${x}% - 29px)`;car.style.top=`${y}%`;car.style.transform=`rotate(${angle}deg)`}
function reset(){x=50;y=60;angle=0;seconds=0;won=false;running=true;timeEl.textContent='0';statusEl.textContent='Կայանիր մեքենան';draw();overlay.style.display='none';clearInterval(timer);timer=setInterval(()=>{if(running){seconds++;timeEl.textContent=seconds}},1000)}
function stop(msg,title){running=false;clearInterval(timer);overlay.innerHTML=`<h2>${title}</h2><p>${msg}</p><button id="next">${title.includes('Հաղթ')&&level<3?'ՀԱՋՈՐԴ ՄԱԿԱՐԴԱԿ':'ԿՐԿԻՆ ԽԱՂԱԼ'}</button>`;overlay.style.display='flex';document.getElementById('next').onclick=()=>{if(title.includes('Հաղթ')){level=level===3?1:level+1;document.getElementById('level').textContent=level;obstacle.style.top=(48+level*3)+'%';}reset()}}
function tick(key){if(!running)return;const old={x,y,angle};if(key==='left')angle=Math.max(-32,angle-5);if(key==='right')angle=Math.min(32,angle+5);let rad=angle*Math.PI/180;if(key==='forward'){x+=Math.sin(rad)*1.6;y-=Math.cos(rad)*1.6}if(key==='reverse'){x-=Math.sin(rad)*1.1;y+=Math.cos(rad)*1.1}x=Math.max(7,Math.min(93,x));y=Math.max(4,Math.min(84,y));draw();
const carRect=car.getBoundingClientRect(),obs=obstacle.getBoundingClientRect(),g=game.getBoundingClientRect();
const overlap=carRect.left<obs.right&&carRect.right>obs.left&&carRect.top<obs.bottom&&carRect.bottom>obs.top;
if(overlap){x=old.x;y=old.y;angle=old.angle;draw();statusEl.textContent='Բախում։ Փորձիր նորից';stop('Դիպար խոչընդոտին։ Փորձիր ավելի ուշադիր կայանել։','🚗 Բախում');return}
const inside=x>61&&x<91&&y<7+level*1&&y<40;
const centered=x>68&&x<84&&y>9&&y<36&&Math.abs(angle)<12;
if(centered){statusEl.textContent='Կայանված է';stop('Հիանալի աշխատանք։ Ժամանակը՝ '+seconds+' վայրկյան։','🏆 Հաղթանակ');return}
}
const held={};function bind(id,key){const b=document.getElementById(id);const down=e=>{e.preventDefault();if(!running)return;held[key]=setInterval(()=>tick(key),90)};const up=()=>{clearInterval(held[key]);held[key]=null};b.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,up))}
bind('left','left');bind('right','right');bind('forward','forward');bind('reverse','reverse');
document.getElementById('brake').onclick=()=>{Object.values(held).forEach(clearInterval);Object.keys(held).forEach(k=>held[k]=null)};
document.getElementById('reset').onclick=reset;document.getElementById('start').onclick=reset;
document.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'forward',ArrowDown:'reverse'};if(map[e.key]){e.preventDefault();if(!keys[e.key]){keys[e.key]=setInterval(()=>tick(map[e.key]),90)}}});
document.addEventListener('keyup',e=>{if(keys[e.key]){clearInterval(keys[e.key]);keys[e.key]=null}});
</script></body></html>
