<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinosaur Park Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10251d;color:#f0fdf4;font-family:Arial}header{text-align:center;padding:16px;background:#183b2d}h1{margin:0;font-size:23px}header p{color:#c5e8d2;font-size:13px}.stats,main{max-width:900px;margin:auto;padding:10px;display:grid;gap:10px}.stats{grid-template-columns:repeat(3,1fr)}main{grid-template-columns:1fr 1fr}.stat,.panel{background:#1b3a2d;border:1px solid #32664c;border-radius:13px;padding:12px}.stat{text-align:center}.stat small{display:block;color:#b8d9c5}.stat b{font-size:20px;color:#fde68a}.park{background:linear-gradient(#8bd4ee 0 35%,#77b95d 35%);border-radius:12px;padding:12px;color:#163b26;min-height:250px}.name{text-align:center;background:#fff3c4;padding:8px;border-radius:8px;font-weight:bold}.pens,.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.pen{background:#b6d88a;border:5px solid #76502d;border-radius:10px;min-height:105px;display:grid;place-content:center;text-align:center;color:#25452b}.dino{font-size:40px}.pen small{background:white;border-radius:7px;padding:3px}.item{display:flex;align-items:center;gap:7px;background:#294c3b;padding:8px;border-radius:9px}.item span{font-size:26px}.item div{flex:1;font-size:13px}.item small{display:block;color:#c0d8c9;margin-top:3px}button{border:0;border-radius:8px;padding:10px;background:#facc15;color:#422006;font-weight:bold;cursor:pointer;font-size:13px}button.alt{background:#3c6651;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.log{height:110px;overflow:auto;background:#10251d;border-radius:8px;padding:9px;font-size:13px;line-height:1.5}.tip{font-size:12px;color:#bad7c4}@media(max-width:650px){main{grid-template-columns:1fr}.stat b{font-size:17px}}
</style></head><body>
<header><h1>🦖 DINOSAUR PARK SIMULATOR</h1><p>Կառուցիր դինոզավրերի այգի, խնամիր նրանց և վաստակիր գումար։</p></header>
<div class="stats"><div class="stat"><small>💰 Գումար</small><b id="money">500 ֏</b></div><div class="stat"><small>👥 Այցելուներ</small><b id="visitors">0</b></div><div class="stat"><small>🦕 Դինոզավրեր</small><b id="count">0</b></div></div>
<main><section class="panel"><h2>🌴 Քո այգին</h2><div class="park"><div class="name">ԼՅՈՎԻԻ ԴԻՆՈ ԱՅԳԻ</div><div class="pens" id="pens"></div></div><div class="actions"><button onclick="toggle()" id="open">Բացել այգին</button><button class="alt" onclick="upgrade()">Ընդլայնել — 400 ֏</button></div><p class="tip" id="status">Գնիր առաջին դինոզավրիդ և բացիր այգին։</p></section>
<section class="panel"><h2>🥚 Գնել դինոզավրեր</h2><div class="shop" id="shop"></div><h2>🍃 Խնամք և եկամուտ</h2><div class="actions"><button onclick="feed()">Կերակրել բոլորին — 20 ֏</button><button class="alt" onclick="collect()">Հավաքել եկամուտը</button></div><h2>📜 Նորություններ</h2><div class="log" id="log">Բարի գալուստ։ Սկսիր՝ գնելով դինոզավր։</div></section></main>
<script>
const ds=[['Փոքրիկ T-Rex','🦖',180,3],['Ստեգոզավր','🦕',140,2],['Երկարավիզ','🦕',220,4],['Ռապտոր','🐲',260,5]];
let money=500,visitors=0,owned=[],open=false,expanded=false,pending=0;
const el=id=>document.getElementById(id);function note(t){el('log').innerHTML=t+'<br>'+el('log').innerHTML}
function draw(){el('money').textContent=money+' ֏';el('visitors').textContent=visitors;el('count').textContent=owned.length;el('shop').innerHTML=ds.map((d,i)=>`<div class="item"><span>${d[1]}</span><div><b>${d[0]}</b><small>${d[2]} ֏ · ուրախություն ${d[3]}</small></div><button onclick="buy(${i})">Գնել</button></div>`).join('');el('pens').innerHTML=(owned.length?owned:[]).map(d=>`<div class="pen"><div class="dino">${d[1]}</div><small>${d[0]}</small></div>`).join('')+(!owned.length?'<div class="pen"><div class="dino">🥚</div><small>Դատարկ վանդակ</small></div>':'')+(expanded?'<div class="pen"><div class="dino">🌳</div><small>Նոր տարածք</small></div>':'');el('open').textContent=open?'Փակել այգին':'Բացել այգին';el('status').textContent=open?'Այգին բաց է․ այցելուները գալիս են։':'Այգին փակ է։ Բացիր՝ տոմսերից գումար վաստակելու համար։'}
function buy(i){let d=ds[i];if(money<d[2])return note('❌ Բավարար գումար չկա։');if(owned.length>=(expanded?8:4))return note('Այգում տեղ չկա․ ընդլայնիր այգին։');money-=d[2];owned.push(d);note('🎉 Գնեցիր '+d[0]+'։');draw()}
function toggle(){if(!owned.length&&!open)return note('Նախ գնիր գոնե մեկ դինոզավր։');open=!open;note(open?'🎟️ Այգին բացվեց։':'🔒 Այգին փակվեց։');draw()}
function upgrade(){if(expanded)return note('Այգին արդեն ընդլայնված է։');if(money<400)return note('❌ Պետք է 400 ֏։');money-=400;expanded=true;note('🌳 Այգին ընդլայնվեց։');draw()}
function feed(){if(!owned.length)return note('Դեռ դինոզավր չունես։');if(money<20)return note('❌ Պետք է 20 ֏։');money-=20;note('🍃 Դինոզավրերը կուշտ են։');draw()}
function collect(){if(!pending)return note('Դեռ եկամուտ չկա։ Բացիր այգին։');money+=pending;note('💰 Հավաքեցիր '+pending+' ֏։');pending=0;draw()}
setInterval(()=>{if(!open)return;let joy=owned.reduce((a,d)=>a+d[3],0),n=Math.max(1,Math.floor(joy/2)+Math.floor(Math.random()*3)),earned=n*10;visitors+=n;pending+=earned;note('👨‍👩‍👧‍👦 Եկան '+n+' այցելու։ Եկամուտ՝ '+earned+' ֏։');draw()},4000);draw();
</script></body></html>
