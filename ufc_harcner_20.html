<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFC Quiz — 20 հարց</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;background:linear-gradient(140deg,#171717,#4b1111);font-family:Arial,sans-serif;color:#222}.card{width:min(720px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 50px #0008}h1{text-align:center;color:#b51f2a;margin:4px 0 8px}.sub{text-align:center;color:#666}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold;margin-top:18px}.bar{height:9px;background:#eee;border-radius:20px;margin:12px 0 20px;overflow:hidden}.fill{height:100%;background:#bd2632;width:0}.question{font-size:21px;font-weight:bold;line-height:1.4;margin:20px 0}.answers{display:grid;gap:10px}.answer{padding:14px;border:2px solid #e4e4e4;border-radius:12px;background:#fafafa;text-align:left;font-size:16px;cursor:pointer}.answer:disabled{cursor:default}.correct{border-color:#16834a;background:#e7f7ed}.wrong{border-color:#c33;background:#fff0f0}.feedback{min-height:28px;margin:14px 0;font-weight:bold}.main{background:#b51f2a;color:white;border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:bold;cursor:pointer}.main:disabled{opacity:.45}.center{text-align:center}.hidden{display:none}input{width:100%;padding:13px;border:2px solid #ddd;border-radius:10px;font-size:16px;margin:10px 0 16px}.score{font-size:44px;font-weight:bold;color:#b51f2a;text-align:center}.review{line-height:1.6}
</style></head><body><main class="card">
<h1>🥊 UFC ՎԻԿՏՈՐԻՆԱ</h1><p class="sub">20 հարց UFC-ի, MMA-ի և հայտնի մարտիկների մասին</p>
<section id="start"><b>Գրի՛ր քո անունը</b><input id="name" maxlength="24" placeholder="Օրինակ՝ Լյով"><button class="main" onclick="startGame()">Սկսել խաղը</button></section>
<section id="quiz" class="hidden"><div class="meta"><span id="player"></span><span id="counter"></span><span id="points">Միավոր՝ 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="center"><button class="main" id="next" onclick="nextQ()" disabled>Հաջորդ հարցը</button></div></section>
<section id="result" class="hidden"><h2 class="center" id="headline"></h2><div class="score" id="score"></div><p class="center" id="summary"></p><div id="review" class="review"></div><div class="center"><button class="main" onclick="restart()">Կրկին խաղալ</button></div></section>
</main><script>
const qs=[["Ի՞նչ է նշանակում UFC հապավումը։", ["Ultimate Fighting Championship", "United Football Club", "Universal Fight Center"], 0], ["Ո՞ր մարզաձևերի համադրության վրա է հիմնված MMA-ն։", ["Միայն բռնցքամարտ", "Տարբեր մարտարվեստներ", "Միայն ըմբշամարտ"], 1], ["Քանի՞ րոպե է սովորական UFC ռաունդը։", ["3 րոպե", "5 րոպե", "10 րոպե"], 1], ["Քանի՞ ռաունդ է սովորական ոչ տիտղոսային մենամարտը։", ["3", "5", "7"], 0], ["Քանի՞ ռաունդ է սովորաբար տիտղոսային մենամարտը։", ["2", "3", "5"], 2], ["Ո՞րն է UFC-ի հայտնի ութանկյունաձև մրցասպարեզի անունը։", ["Ռինգ", "Օկտագոն", "Կորտ"], 1], ["Ո՞ր քաշային կարգն է ավելի թեթև։", ["Թեթև քաշ", "Ծանր քաշ", "Գերծանր քաշ"], 0], ["Ո՞ր մարտիկին են հաճախ անվանում «The Notorious»։", ["Կոնոր Մաքգրեգոր", "Մաքս Հոլոուեյ", "Ալեքսանդր Վոլկանովսկի"], 0], ["Ո՞ր երկրից է Խաբիբ Նուրմագոմեդովը։", ["Իռլանդիա", "Ռուսաստան", "Բրազիլիա"], 1], ["Ո՞ր մարտիկին են անվանում «Bones»։", ["Ջոն Ջոնս", "Իսրայել Ադեսանյա", "Չարլզ Օլիվեյրա"], 0], ["Ո՞ր մարտիկն է հայտնի «The Last Stylebender» մականունով։", ["Իսրայել Ադեսանյա", "Դասթին Պորյե", "Շոն Օ'Մալլի"], 0], ["Ի՞նչ է նշանակում KO։", ["Տեխնիկական ընդմիջում", "Նոկաուտ", "Հավասար արդյունք"], 1], ["Ի՞նչ է նշանակում submission հաղթանակը։", ["Մրցակիցը հանձնվում է հնարքի պատճառով", "Հաղթանակ միավորներով", "Մենամարտը հետաձգվում է"], 0], ["Ո՞վ է մենամարտի ընթացքում հետևում կանոնների պահպանմանը։", ["Մարզիչը", "Մրցավարը", "Մեկնաբանը"], 1], ["Ի՞նչ է անում մրցավարը, երբ մենամարտը պետք է դադարեցվի։", ["Շարունակում է հաշվել միավորները", "Դադարեցնում է մենամարտը", "Փոխում է ռաունդը"], 1], ["Ո՞ր մարտիկին են անվանում «Blessed»։", ["Մաքս Հոլոուեյ", "Խաբիբ Նուրմագոմեդով", "Ալեքս Պերեյրա"], 0], ["Ո՞ր երկրից է Ալեքս Պերեյրան։", ["Բրազիլիա", "ԱՄՆ", "Կանադա"], 0], ["Ինչպե՞ս է կոչվում մենամարտի ժամանակը չափող հատվածը։", ["Ռաունդ", "Սեթ", "Իննինգ"], 0], ["Ի՞նչ է նշանակում հաղթանակ միավորներով։", ["Մրցավարները որոշում են հաղթողին", "Մարտիկը լքում է մրցասպարեզը", "Մենամարտը չի սկսվում"], 0], ["Ո՞րն է MMA մարզիկի պատրաստության կարևոր մասը։", ["Միայն վազքը", "Տարբեր մարտարվեստների և ֆիզիկական պատրաստության մարզումները", "Միայն ծանրություններ բարձրացնելը"], 1]];let i=0,points=0,miss=[];
function startGame(){document.getElementById('player').textContent='Խաղացող՝ '+(document.getElementById('name').value.trim()||'UFC երկրպագու');document.getElementById('start').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');i=0;points=0;miss=[];render()}
function render(){const q=qs[i];document.getElementById('counter').textContent=(i+1)+' / 20';document.getElementById('points').textContent='Միավոր՝ '+points;document.getElementById('fill').style.width=(i/20*100)+'%';document.getElementById('question').textContent=(i+1)+'. '+q[0];document.getElementById('feedback').textContent='';const next=document.getElementById('next');next.disabled=true;next.textContent=i===19?'Տեսնել արդյունքը':'Հաջորդ հարցը';const box=document.getElementById('answers');box.innerHTML='';q[1].forEach((a,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+j)+'. '+a;b.onclick=()=>answer(j);box.appendChild(b)})}
function answer(v){const q=qs[i];document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===v&&v!==q[2])b.classList.add('wrong')});const f=document.getElementById('feedback');if(v===q[2]){points++;f.textContent='Ճիշտ պատասխան է՛։';f.style.color='#16834a'}else{miss.push('Հարց '+(i+1)+'. '+q[0]+' — ճիշտ պատասխան՝ '+q[1][q[2]]);f.textContent='Սխալ է։ Ճիշտ պատասխանը նշված է կանաչով։';f.style.color='#b51f2a'}document.getElementById('points').textContent='Միավոր՝ '+points;document.getElementById('next').disabled=false}
function nextQ(){if(++i<20)render();else finish()}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('headline').textContent=points>=16?'🏆 Գերազանց արդյունք։':'🥊 Լավ փորձ էր։';document.getElementById('score').textContent=points+' / 20';document.getElementById('summary').textContent='Ճիշտ պատասխաններ՝ '+(points*5)+'%';document.getElementById('review').textContent=miss.length?miss.join(' • '):'Բոլոր պատասխանները ճիշտ են։'}
function restart(){document.getElementById('result').classList.add('hidden');document.getElementById('start').classList.remove('hidden');document.getElementById('name').value=''}
</script></body></html>
