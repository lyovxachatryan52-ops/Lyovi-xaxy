<!doctype html><html lang="hy"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D Moto Racing</title><style>
*{box-sizing:border-box}body{margin:0;background:#081725;color:white;font-family:Arial;text-align:center}#menu{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(#315e79,#07131c)}.panel{max-width:620px;padding:25px;border:2px solid #61caff;border-radius:24px;background:#102b40}.bike{font-size:100px}h1{font-size:clamp(42px,10vw,70px);color:#ffd34e;text-shadow:4px 4px #000;margin:8px}.btn,button{border:0;border-radius:13px;padding:13px 20px;background:linear-gradient(#28baff,#075baf);color:white;font-size:19px;font-weight:bold}#game{display:none;max-width:760px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}.pill{background:#17384d;padding:10px;border-radius:10px}canvas{width:100%;height:auto;border:2px solid #62caff;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:center;gap:20px;margin:12px}.controls button{width:100px;height:58px;font-size:28px;touch-action:none}#over{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:20px}.dialog{background:#12344a;border:2px solid #62caff;border-radius:20px;padding:24px}
</style><div id="menu"><div class="panel"><div class="bike">🏍️</div><h1>3D MOTO<br>RACING</h1><p>Մրցիր մայրուղու վրա, շրջանցիր մեքենաները և հավաքիր միավորներ։</p><button onclick="start()">▶ ՍԿՍԵԼ ՄՐՑԱՎԱԶՔԸ</button><p>Կառավարում՝ սլաքներով կամ էկրանի կոճակներով։</p></div></div>
<div id="game"><div class="top"><span class="pill" id="score">Միավորներ՝ 0</span><span class="pill" id="speed">Արագություն՝ 80</span><button onclick="menu()">Մենյու</button></div><canvas id="cv" width="720" height="520"></canvas><p>Շրջանցիր մեքենաները և մի բախվիր։</p><div class="controls"><button id="left">⬅️</button><button id="right">➡️</button></div></div>
<div id="over"><div class="dialog"><h2>🏁 Մրցավազքն ավարտվեց</h2><p id="result"></p><button onclick="start()">Նորից խաղալ</button><button onclick="menu()">Մենյու</button></div></div>
<script>
const cv=document.getElementById('cv'),c=cv.getContext('2d');let lane=0,score=0,speed=5,traffic=[],keys={},tick=0,ended=false,raf;
function start(){document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';document.getElementById('over').style.display='none';lane=0;score=0;speed=5;traffic=[];tick=0;ended=false;cancelAnimationFrame(raf);loop()}
function menu(){cancelAnimationFrame(raf);document.getElementById('game').style.display='none';document.getElementById('over').style.display='none';document.getElementById('menu').style.display='grid'}
function spawn(){traffic.push({lane:Math.floor(Math.random()*3)-1,y:-50,type:Math.random()<.5?'🚙':'🚚'})}
function draw(){let g=c.createLinearGradient(0,0,0,520);g.addColorStop(0,'#7bc9ee');g.addColorStop(.5,'#d7e7a0');g.addColorStop(.51,'#477c42');g.addColorStop(1,'#23482d');c.fillStyle=g;c.fillRect(0,0,720,520);c.fillStyle='#353b43';c.beginPath();c.moveTo(300,0);c.lineTo(420,0);c.lineTo(680,520);c.lineTo(40,520);c.fill();c.strokeStyle='white';c.lineWidth=5;c.beginPath();c.moveTo(300,0);c.lineTo(40,520);c.moveTo(420,0);c.lineTo(680,520);c.stroke();for(let i=0;i<10;i++){let y=(i*75+tick*8)%600,t=y/520,w=2+10*t;c.fillStyle='#f7e8a0';c.fillRect(360-w/2,y,w,28*t+4)}for(let i=0;i<8;i++){let y=(i*78+tick*5)%520;c.font=(20+y/18)+'px Arial';c.fillText('🌲',70-y*.18,y+8);c.fillText('🌲',600+y*.18,y+8)}traffic.forEach(v=>{let t=Math.max(.1,v.y/520),x=360+v.lane*(35+150*t);c.font=(24+35*t)+'px Arial';c.textAlign='center';c.fillText(v.type,x,v.y)});c.font='76px Arial';c.fillText('🏍️',360+lane*150,465)}
function update(){tick++;if(tick%58===0)spawn();traffic.forEach(v=>v.y+=speed+2);traffic=traffic.filter(v=>v.y<580);if(keys.left||keys.ArrowLeft)lane=Math.max(-1,lane-.06);if(keys.right||keys.ArrowRight)lane=Math.min(1,lane+.06);for(let v of traffic)if(v.y>390&&v.y<475&&Math.abs(v.lane-lane)<.35){end();return}score++;if(score%400===0)speed=Math.min(12,speed+.5);document.getElementById('score').textContent='Միավորներ՝ '+score;document.getElementById('speed').textContent='Արագություն՝ '+Math.round(80+speed*8)}
function end(){ended=true;document.getElementById('result').textContent='Քո արդյունքը՝ '+score+' միավոր։';document.getElementById('over').style.display='grid'}
function loop(){if(ended)return;update();draw();raf=requestAnimationFrame(loop)}
[['left','left'],['right','right']].forEach(([id,k])=>{let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});document.addEventListener('keydown',e=>keys[e.key]=true);document.addEventListener('keyup',e=>keys[e.key]=false);
</script></html>
